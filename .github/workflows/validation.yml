# Vérifie à chaque push ce que HACS et Home Assistant vérifieront chez
# les clients : la structure du dépôt (HACS) et le manifeste (hassfest).
name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands : les icônes viennent du dépôt home-assistant/brands,
          # où l'intégration n'est pas encore inscrite.
          # license : HACS n'accepte que les licences reconnues par
          # GitHub (MIT, Apache…) ; « Tous droits réservés » ne l'est
          # pas. Ce contrôle ne vaut que pour la liste officielle de
          # HACS — l'installation par dépôt personnalisé ne le fait pas.
          ignore: brands license

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
