# Copie ce fichier en « reglages.ini », dans le même dossier, et remplis-le.
# reglages.ini contient ton jeton : il n'est jamais envoyé sur GitHub.

[home_assistant]
# La même adresse que dans ton navigateur, sans « / » à la fin.
url = http://192.168.68.72

# Jeton d'accès longue durée : ton profil Home Assistant (ton nom, en bas
# à gauche) → onglet Sécurité → Jetons d'accès longue durée → Créer un jeton.
jeton =

# Vide = trouvé tout seul (Whisper). Sinon, par exemple : stt.faster_whisper
reconnaissance =

agent = conversation.zionia
langue = fr

[ecoute]
# Un mot fourni : hey_jarvis, hey_mycroft, alexa, hey_rhasspy
# ou ton propre modèle, posé dans ce dossier : ok_zionia.onnx
mot = hey_jarvis

# De 0 à 1. Il se déclenche tout seul ? Monte à 0.6 ou 0.7.
# Il ne t'entend pas ? Descends à 0.4.
seuil = 0.5

# Vide = le micro par défaut de Windows. Sinon un numéro ou un bout de
# nom, d'après : .venv\Scripts\python zionia_ecoute.py --micros
micro =

# Secondes de silence qui terminent la question.
silence = 1.0
# Secondes maximum pour une question.
duree_max = 15
# Secondes pour commencer à parler après le bip.
attente_parole = 5
